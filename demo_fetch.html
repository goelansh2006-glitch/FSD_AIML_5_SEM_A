<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO FETCH IN JS</title>
    <style>
        table{
            margin: auto;
            width: 80%;
            padding: 10px;
            background-color: antiquewhite;
            color: brown;
            border: 2px solid blue;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th> S.no </th>
                <th> title </th>
                <th> Image </th>
                <th> QR code </th>
                <th> Category </th>
                <th> Price </th>
                <th> Rating </th>
                <th> Stock </th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
        <script>
        const ele = document.getElementById("data");
        const URL = "https://dummyjson.com/products?limit=195";
    async function loadProducts(){
        try{
            const res=await fetch(URL);
            const data=await res.json();
            console.log("DATA=",data.products);
            let row="";
            data.products.map((i,index)=>{
                row+=`
                <tr>
                    <td> ${index+1}</td>
                    <td> ${i.title}</td>
                    <td> <img src=${i.images[0]} height="150px" width="150px"></td>
                    <td> <img src=${i.meta.qrCode}></td>
                    <td> ${i.category}</td>
                    <td> ₹${i.price}</td>
                    <td> ${i.rating}</td>
                    <td> ${i.stock}</td>
                    </tr>
                    `;
                    ele.innerHTML=row;
            })
        }
        catch(err){
            console.log("ERROR: ",err);
        }
    }
    loadProducts();
    </script>
</body>
</html>
